<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FreelaFlow · Controle financeiro para freelancers</title>
  <meta name="description" content="Controle financeiro para desenvolvedores freelancers: receitas, despesas, clientes, projetos e metas em um só lugar.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235cf59a'/%3E%3Cstop offset='1' stop-color='%230f7a3a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M10 22V10h12M10 16h8' stroke='%2303140a' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#dashboard" aria-label="FreelaFlow — início">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 19V5h12M6 12h8"/></svg>
        </span>
        <span class="brand-name">Freela<b>Flow</b></span>
      </a>
      <nav id="nav" class="nav" aria-label="Navegação principal"></nav>
      <div class="sidebar-footer">
        <button id="theme-toggle" class="nav-link theme-toggle" data-action="theme" type="button"></button>
        <div class="user">
          <span id="user-avatar"></span>
          <div><strong id="user-name">Freelancer</strong><span class="muted small">Dev freelancer</span></div>
        </div>
      </div>
    </aside>

    <main class="main">
      <div id="demo-banner" class="banner" hidden>
        <span>✨ Você está vendo <strong>dados de exemplo</strong>. Explore à vontade e, quando quiser, comece com os seus.</span>
        <div class="banner-actions">
          <button class="btn sm ghost" data-action="demo-keep">Manter exemplo</button>
          <button class="btn sm primary" data-action="demo-clear">Começar do zero</button>
        </div>
      </div>

      <header class="topbar">
        <div>
          <h1 id="view-title">Visão geral</h1>
          <p id="view-subtitle" class="muted"></p>
        </div>
        <div id="topbar-actions" class="topbar-actions"></div>
      </header>

      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>

  <dialog id="modal" class="modal"></dialog>
  <div id="toasts" class="toasts" role="status"></div>
  <div id="tooltip" class="tooltip" hidden></div>

  <noscript>O FreelaFlow precisa de JavaScript habilitado.</noscript>

  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
